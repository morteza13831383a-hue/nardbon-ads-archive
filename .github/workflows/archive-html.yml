name: One-off Iran HTML archive

on:
  # Was: every push of crawl parts (~26 runs/day, ~90 min/day). Parts now wait and are
  # imported together every 6 h: dispatched by sync.yml (hourly, cron-job.org), with
  # GitHub's own schedule only as a backup.
  schedule:
    - cron: "53 */12 * * *"
  workflow_dispatch:
    inputs:
      import_only:
        description: 'Only import and publish externally collected pages; GitHub source access returned 403'
        type: boolean
        default: true
      upload_exports:
        description: 'Upload CSV/gzip after nb-upload.php allows these types; otherwise retain them as artifacts'
        type: boolean
        default: false
      max_pages:
        description: 'HTML/sitemap page budget for this slice (no API calls)'
        default: '1500'
        required: true
      resume_run_id:
        description: 'Optional earlier archive run ID to resume; blank resumes latest checkpoint'
        default: ''
      retry_failed:
        description: 'Retry exhausted transient/parser failures after fixing the cause'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

# Same lock as sync.yml: do not overwrite panel data while the normal sync is writing.
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore the last archive checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN: ${{ inputs.resume_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive-work outbox/media
          if [[ -n "$REQUESTED_RUN" ]]; then
            [[ "$REQUESTED_RUN" =~ ^[0-9]+$ ]] || { echo 'Invalid run ID'; exit 1; }
            artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REQUESTED_RUN/artifacts" --jq '[.artifacts[] | select(.name == "iran-html-checkpoint" and .expired == false)] | max_by(.id) | .id // empty')
            [[ -n "$artifact" ]] || { echo 'Requested checkpoint not found'; exit 1; }
          else
            artifact=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?name=iran-html-checkpoint&per_page=100" --jq '.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main") | .id' | sort -nr | sed -n '1p')
          fi
          if [[ -n "$artifact" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > checkpoint.zip
            python - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('checkpoint.zip') as z:
              for item in z.infolist():
                  path = Path(item.filename)
                  allowed = path.parts and path.parts[0] in ('archive-work', 'outbox')
                  if path.is_absolute() or '..' in path.parts or not allowed:
                      raise RuntimeError('Unexpected checkpoint member: ' + item.filename)
              z.extractall('.')
          PY
            echo "Restored checkpoint artifact $artifact"
          else
            # An existing archive with a lost/expired checkpoint must not restart silently.
            if [[ -f data/html-archive-summary.json ]]; then
              echo 'Archive exists but checkpoint is unavailable. Restore its artifact before resuming.'
              exit 1
            fi
            echo 'Starting a new fixed-cutoff, one-off archive'
          fi
      - name: Collect or import public HTML archive (no source API)
        env:
          PAGE_BUDGET: ${{ inputs.max_pages || '80' }}
          RETRY_FAILED: ${{ inputs.retry_failed }}
          FETCH_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.import_only == false }}
          ARCHIVE_ACCESS_TOKEN: ${{ secrets.ARCHIVE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PAGE_BUDGET" =~ ^[0-9]+$ ]] || { echo 'Invalid page budget'; exit 1; }
          retry=()
          if [[ "$RETRY_FAILED" == 'true' ]]; then retry=(--retry-failed); fi
          mode=()
          if [[ "$FETCH_SOURCE" != 'true' ]]; then mode=(--export-only); fi
          python scripts/archive_html.py --import-dir data/html-archive-import --max-pages "$PAGE_BUDGET" --max-seconds 5400 "${retry[@]}" "${mode[@]}"
      # hashFiles() hashes the whole file; the checkpoint is large now and it timed out
      # after 120 s. A plain existence test is instant.
      - name: Check work files
        id: work
        if: always()
        shell: bash
        run: |
          echo "manifest=$([ -f archive-work/exports/manifest.json ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "checkpoint=$([ -f archive-work/checkpoint.sqlite3 ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          ls -la archive-work/checkpoint.sqlite3 2>/dev/null || true
      - name: Merge and upload collected archive
        if: success() && steps.work.outputs.manifest == 'yes'
        env:
          UPLOAD_URL: ${{ secrets.UPLOAD_URL }}
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
          TIME_BUDGET_SEC: '900'
          MEDIA_PER_RUN: '0'
          UPLOAD_EXPORTS: ${{ github.event_name == 'schedule' || inputs.upload_exports }}
        shell: bash
        run: |
          mode=()
          if [[ "$UPLOAD_EXPORTS" != 'true' ]]; then mode=(--panel-only); fi
          python scripts/archive_publish.py --upload "${mode[@]}"
      - name: Record coverage summary
        if: always()
        run: |
          if [ -f archive-work/exports/manifest.json ]; then
            mkdir -p data
            cp archive-work/exports/manifest.json data/html-archive-summary.json
            python - <<'PY'
          import json, os
          d = json.load(open('archive-work/exports/manifest.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('### One-off Iran archive\n\n')
              f.write(f"Iran ads collected: **{d['iran_ads_extracted']}**\n\n")
              f.write(f"Fixed cutoff: {d['cutoff']}\n\n")
              f.write(f"Queue: `{json.dumps(d['queue_status'])}`\n\n")
              f.write('This is partial until discovery and errors have been reviewed. No source API or channel crawler was run.\n')
          PY
          fi
      - name: Prepare resumable checkpoint
        if: always() && steps.work.outputs.checkpoint == 'yes'
        run: |
          mkdir -p archive-checkpoint/archive-work archive-checkpoint/outbox/media
          cp archive-work/checkpoint.sqlite3 archive-checkpoint/archive-work/
          if [ -f archive-work/export-receipts.json ]; then
            cp archive-work/export-receipts.json archive-checkpoint/archive-work/
          fi
          cp -a outbox/media/. archive-checkpoint/outbox/media/
          touch archive-checkpoint/outbox/media/placeholder.txt
      - name: Save resumable checkpoint and queued images
        if: always() && steps.work.outputs.checkpoint == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: iran-html-checkpoint
          retention-days: 90
          path: archive-checkpoint/
      - name: Save detailed exports
        if: always() && steps.work.outputs.manifest == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: iran-html-exports
          retention-days: 3
          path: archive-work/exports/
      - name: Commit panel data and coverage report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nardbon-archive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # merges instead of failing when sync.yml pushed data first
          python scripts/commit_data.py 'Import one-off Iran HTML archive slice'
