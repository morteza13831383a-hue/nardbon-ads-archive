name: sync-telegram-ads

on:
  schedule:
    # The main trigger is cron-job.org calling workflow_dispatch every 30 minutes,
    # because GitHub often delays or drops scheduled runs. This is only a backup.
    - cron: "41 */6 * * *"
  workflow_dispatch:           # "Run workflow" button for manual runs
    inputs:
      report:
        description: "Send the daily report now"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write        # to start the archive importer (GitHub's own schedule skips most runs)
  issues: write         # daily report issue (GitHub e-mails the owner, who is mentioned)

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 400      # the daily report counts collector deliveries of the last 24 h

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # images that could not reach the host yet are kept between runs
      - uses: actions/cache/restore@v4
        with:
          path: outbox
          key: outbox-${{ github.run_id }}
          restore-keys: outbox-

      - name: Sync
        env:
          TGADS_API_KEY: ${{ secrets.TGADS_API_KEY }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          UPLOAD_URL: ${{ secrets.UPLOAD_URL }}
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
          CHANNELS_API_KEY: ${{ secrets.CHANNELS_API_KEY }}
        run: python scripts/sync.py

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: outbox
          key: outbox-${{ github.run_id }}

      # Daily report at 04:35 UTC (08:05 Tehran): an issue that mentions the owner, so it arrives
      # by e-mail; yesterday's issue is closed. Never fails the run.
      - name: Daily report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = "04" ] || [ "${{ github.event.inputs.report }}" = "true" ]; then
            python scripts/daily_report.py || echo "daily report failed"
          fi

      - name: Save data to repository
        if: always()
        run: |
          git config user.name "nardbon-archive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # merges instead of failing when archive-html.yml pushed data first
          python scripts/commit_data.py "sync $(date -u +%Y-%m-%dT%H:%MZ)"

      # The old-ads importer (archive-html.yml) runs every 6 h. GitHub's scheduler drops most
      # of its runs, so this hourly run (started reliably by cron-job.org) dispatches it.
      - name: Start the archive importer every 6 hours
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ $(( 10#$(date -u +%H) % 6 )) -eq 0 ]; then
            gh workflow run archive-html.yml --ref main && echo "archive importer dispatched"
          fi
